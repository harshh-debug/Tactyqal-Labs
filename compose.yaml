services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tactyqal
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tactyqal_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactyqal -d tactyqal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: tactyqal
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tactyqal_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactyqal -d tactyqal_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
